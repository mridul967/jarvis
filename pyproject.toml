[project]
name = "anywhere-door"
version = "0.1.0"
description = "Quantum-inspired VRPTW optimization workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dimod>=0.12.22",
    "fastapi>=0.116",
    "numpy>=2.2",
    "simulated-bifurcation>=2.0.0",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.35",
    "ortools>=9.8.0"
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.15"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
