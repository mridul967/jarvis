[project]
name = "anywhere-door"
version = "0.1.0"
description = "Quantum-inspired VRPTW optimization workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "jax>=0.11.1",
    "jaxlib>=0.11.1",
    "matplotlib>=3.11.1",
    "networkx>=3.3",
    "numpy>=2.2",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch>=2.3",
    "torch_geometric>=2.5",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.15"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
